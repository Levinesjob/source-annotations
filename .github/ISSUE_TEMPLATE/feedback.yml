name: 使用问题或内容纠错
description: 报告无法使用、解释不准确或排版问题
body:
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 系统、智能体、模型（如已知）、Python与工具版本
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 论文版本与页码（内容问题时填写）
      description: 安装问题可留空；内容纠错请提供公开链接和原句位置，勿上传公司或私人材料
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 预期、实际结果与复现步骤
      description: 内容纠错请附准确原句及依据；截图请先移除私人信息
    validations:
      required: true
